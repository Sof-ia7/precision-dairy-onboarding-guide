# TEMPLATE ONLY. Do not put real passwords in git.
# Create the real secret with kubectl (see DEPLOY.md), or copy this file to
# deploy/templates/secrets.yaml (git-ignored), fill it in, and apply it once.
apiVersion: v1
kind: Secret
metadata:
  name: dairy-db
type: Opaque
stringData:
  POSTGRES_HOST: postgres          # the Service name in 10-postgres.yaml
  POSTGRES_PORT: "5432"
  POSTGRES_DB: dairy
  POSTGRES_USER: dairy             # writer: used by the pipeline
  POSTGRES_PASSWORD: CHANGE-ME
  POSTGRES_SCHEMA: dairy
  GRAFANA_DB_USER: grafana_reader  # read-only: used by Grafana
  GRAFANA_DB_PASSWORD: CHANGE-ME-TOO
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: CHANGE-ME-ADMIN
